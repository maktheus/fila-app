worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Log sem a query string.
    #
    # Os links de acesso e de cancelamento carregam o token em ?t=, e o log
    # padrao registra a URL inteira. Quem tivesse acesso ao arquivo de log —
    # ou a qualquer pipeline que colete logs — teria tokens validos para
    # entrar no painel de qualquer cliente.
    #
    # $uri em vez de $request: perde-se a query no log, que e exatamente o
    # que se quer. Para depurar rota, o caminho basta.
    log_format sem_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    upstream backend {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Token nao entra em log. Vale para tudo: o custo de perder a query
        # string no log e menor que o de vazar credencial de acesso.
        access_log /var/log/nginx/access.log sem_query;

        # API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Health check
        location /health {
            proxy_pass http://backend/api/health;
        }

        # Frontend (for local dev — in production, GitHub Pages serves the frontend)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        }
    }
}
