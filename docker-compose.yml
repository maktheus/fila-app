services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

  # Coletor de e-mail local: captura tudo que o backend enviar e mostra numa
  # caixa de entrada em http://localhost:8025. Nada sai para a internet.
  # Serve para ver o e-mail de verdade, com formatacao e tudo, sem contratar
  # provedor nenhum:
  #   docker compose --profile mail up -d
  #   MAIL_ENABLED=true SMTP_HOST=mailpit SMTP_PORT=1025 docker compose up -d backend
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles:
      - mail
    ports:
      - "8025:8025"
    environment:
      - MP_MAX_MESSAGES=500

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fila}
      - POSTGRES_USER=${POSTGRES_USER:-fila}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fila-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fila} -d ${POSTGRES_DB:-fila}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-fila}:${POSTGRES_PASSWORD:-fila-dev-password}@postgres:5432/${POSTGRES_DB:-fila}
      - VENUE_QR_TOKEN=${VENUE_QR_TOKEN:-demo-centro}
      - VENUE_LAT=${VENUE_LAT:--3.119028}
      - VENUE_LNG=${VENUE_LNG:--60.021731}
      - PROXIMITY_RADIUS_METERS=${PROXIMITY_RADIUS_METERS:-120}
      - PLAN=${PLAN:-free}
      - ADS_ENABLED=${ADS_ENABLED:-true}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-8}
      # Assina os links de cancelamento que vao nos e-mails. OBRIGATORIO em
      # producao: sem ele o servidor recusa assinar e cancelar volta a
      # depender da senha do operador.
      - LINK_SECRET=${LINK_SECRET:-}
      - LINK_TOKEN_TTL_HOURS=${LINK_TOKEN_TTL_HOURS:-72}
      - LINK_EXCLUSAO_TTL_MINUTOS=${LINK_EXCLUSAO_TTL_MINUTOS:-60}
      - LINK_ACESSO_TTL_MINUTOS=${LINK_ACESSO_TTL_MINUTOS:-30}
      - RATE_LIMIT_ACESSO=${RATE_LIMIT_ACESSO:-8}
      - TICKET_RETENTION_HOURS=${TICKET_RETENTION_HOURS:-12}
      - SEED_DEMO=${SEED_DEMO:-true}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost}
      - TRIAL_DAYS=${TRIAL_DAYS:-14}
      - PLAN_PRICE_CENTS=${PLAN_PRICE_CENTS:-9900}
      # Anual sai por dez meses: sem cartao guardado, cada renovacao mensal e
      # uma chance de perder o cliente por esquecimento.
      - PLAN_PRICE_YEAR_CENTS=${PLAN_PRICE_YEAR_CENTS:-99000}
      - BILLING_GRACE_DAYS=${BILLING_GRACE_DAYS:-3}
      - BILLING_NOTICE_DAYS=${BILLING_NOTICE_DAYS:-3}
      - BILLING_CYCLE_INTERVAL_MINUTES=${BILLING_CYCLE_INTERVAL_MINUTES:-60}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-sandbox}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      # Mercado Pago: so usados com PAYMENT_PROVIDER=mercadopago
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
      - MP_WEBHOOK_SECRET=${MP_WEBHOOK_SECRET:-}
      - MP_PIX_EXPIRA_MINUTOS=${MP_PIX_EXPIRA_MINUTOS:-1440}
      - RATE_LIMIT_COBRANCA=${RATE_LIMIT_COBRANCA:-10}
      # Google Pay: gateway e gatewayMerchantId precisam ser confirmados com
      # o suporte do MP. Vazios = botao nao aparece.
      - GPAY_GATEWAY=${GPAY_GATEWAY:-}
      - GPAY_GATEWAY_MERCHANT_ID=${GPAY_GATEWAY_MERCHANT_ID:-}
      - GPAY_MERCHANT_ID=${GPAY_MERCHANT_ID:-}
      - GPAY_MERCHANT_NAME=${GPAY_MERCHANT_NAME:-Fila Virtual}
      - GPAY_ENVIRONMENT=${GPAY_ENVIRONMENT:-TEST}
      - GPAY_CARD_NETWORKS=${GPAY_CARD_NETWORKS:-MASTERCARD,VISA,AMEX,ELO}
      # E-mail transacional. Sem isto o cliente cria a fila e nunca mais ouve
      # falar de voce — o servidor grita no log se estiver ligado e quebrado.
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_FROM=${MAIL_FROM:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_RETRIES=${MAIL_RETRIES:-3}
      - CHAT_PROVIDER=${CHAT_PROVIDER:-local}
      - LOCAL_LLM_KEEP_ALIVE=${LOCAL_LLM_KEEP_ALIVE:-30m}
      # O runtime local roda na maquina host, fora do compose. Dentro do
      # container, "localhost" e o proprio container — por isso host.docker.internal.
      - LOCAL_LLM_BASE=${LOCAL_LLM_BASE:-http://host.docker.internal:11434/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen2.5:7b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHAT_MODEL=${CHAT_MODEL:-claude-opus-5}
      - CHAT_EFFORT=${CHAT_EFFORT:-low}
      - VENUE_NAME=Unidade Centro
      - OPERATOR_NAME=Equipe balcao
    extra_hosts:
      # No Docker Desktop ja existe; no Linux precisa desta linha.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  uptime-kuma-data:
