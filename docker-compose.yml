services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fila}
      - POSTGRES_USER=${POSTGRES_USER:-fila}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fila-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fila} -d ${POSTGRES_DB:-fila}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-fila}:${POSTGRES_PASSWORD:-fila-dev-password}@postgres:5432/${POSTGRES_DB:-fila}
      - VENUE_QR_TOKEN=${VENUE_QR_TOKEN:-demo-centro}
      - VENUE_LAT=${VENUE_LAT:--3.119028}
      - VENUE_LNG=${VENUE_LNG:--60.021731}
      - PROXIMITY_RADIUS_METERS=${PROXIMITY_RADIUS_METERS:-120}
      - PLAN=${PLAN:-free}
      - ADS_ENABLED=${ADS_ENABLED:-true}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-8}
      - TICKET_RETENTION_HOURS=${TICKET_RETENTION_HOURS:-12}
      - SEED_DEMO=${SEED_DEMO:-true}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost}
      - TRIAL_DAYS=${TRIAL_DAYS:-14}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-sandbox}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - CHAT_PROVIDER=${CHAT_PROVIDER:-local}
      # O runtime local roda na maquina host, fora do compose. Dentro do
      # container, "localhost" e o proprio container — por isso host.docker.internal.
      - LOCAL_LLM_BASE=${LOCAL_LLM_BASE:-http://host.docker.internal:11434/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen2.5:7b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHAT_MODEL=${CHAT_MODEL:-claude-opus-5}
      - CHAT_EFFORT=${CHAT_EFFORT:-low}
      - VENUE_NAME=Unidade Centro
      - OPERATOR_NAME=Equipe balcao
    extra_hosts:
      # No Docker Desktop ja existe; no Linux precisa desta linha.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  uptime-kuma-data:
