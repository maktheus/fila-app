name: Release

# Dispara com uma tag de versao: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao a construir, ex.: v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nada e publicado sem a suite passar.
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  versao:
    name: Resolver versao
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.calc.outputs.name }}
      code: ${{ steps.calc.outputs.code }}
    steps:
      - id: calc
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          name="${raw#v}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versao invalida: $raw (esperado vX.Y.Z)"; exit 1
          fi
          IFS='.' read -r major minor patch <<< "$name"
          # versionCode monotonico: 1.2.3 -> 10203
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Versao $name (versionCode $code)"

  android:
    name: Build do .aab
    needs: [testes, versao]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sincronizar o front para os assets do app
        shell: bash
        run: |
          target=mobile/android/app/src/main/assets/public
          rm -rf "$target" && mkdir -p "$target"
          cp -r frontend/. "$target/"
          cat > "$target/config.js" <<EOF
          window.FILA_API_BASE = '${{ vars.FILA_API_BASE }}';
          window.FILA_WS_BASE = '${{ vars.FILA_WS_BASE }}';
          window.FILA_ADS_ENABLED = ${{ vars.FILA_ADS_ENABLED || 'true' }};
          window.FILA_PLATFORM = 'android';
          window.FILA_WEB_ADS_PROVIDER = 'gam';
          window.FILA_GAM_NETWORK_CODE = '${{ vars.FILA_GAM_NETWORK_CODE }}';
          window.FILA_GAM_AD_UNIT_PREFIX = 'fila_virtual';
          window.FILA_GAM_SLOTS = {};
          window.FILA_MOBILE_ADS_PROVIDER = 'admob';
          window.FILA_ADMOB_ANDROID_APP_ID = '${{ vars.FILA_ADMOB_ANDROID_APP_ID }}';
          window.FILA_ADMOB_UNITS = {
            banner: '${{ vars.FILA_ADMOB_BANNER_UNIT_ID }}',
            interstitial: '${{ vars.FILA_ADMOB_INTERSTITIAL_UNIT_ID }}',
            appOpen: '',
          };
          EOF

      - name: Restaurar a keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "sem keystore: o build sai nao assinado"
            echo "assinado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "assinado=true" >> "$GITHUB_OUTPUT"

      - name: Montar o .aab
        working-directory: mobile/android
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(
            "-PversionNameOverride=${{ needs.versao.outputs.name }}"
            "-PversionCodeOverride=${{ needs.versao.outputs.code }}"
            "-PFILA_CLIENT_ENTRY_URL=${{ vars.FILA_CLIENT_ENTRY_URL }}"
            "-PFILA_TRUSTED_HOST=${{ vars.FILA_TRUSTED_HOST }}"
            "-PFILA_ADMOB_ANDROID_APP_ID=${{ vars.FILA_ADMOB_ANDROID_APP_ID }}"
          )
          if [ "${{ steps.keystore.outputs.assinado }}" = "true" ]; then
            args+=(
              "-PFILA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              "-PFILA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              "-PFILA_KEY_ALIAS=$KEY_ALIAS"
              "-PFILA_KEY_PASSWORD=$KEY_PASSWORD"
            )
          fi
          # O repo versiona o wrapper .bat e o jar, mas nao o script Unix;
          # chamamos o wrapper pelo jar, que e o que o gradlew faz por baixo.
          java -classpath gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain \
            bundleRelease "${args[@]}" --no-daemon

      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: fila-app-${{ needs.versao.outputs.name }}-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Publicar release
    needs: [versao, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fila-app-${{ needs.versao.outputs.name }}-aab
          path: artefatos

      - name: Criar a release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fila Virtual ${{ needs.versao.outputs.name }}
          generate_release_notes: true
          files: artefatos/*.aab
          body: |
            ## Como publicar

            1. Baixe o `.aab` desta release.
            2. Play Console > Teste fechado (ou Produção) > Criar lançamento.
            3. Envie o `.aab` e confira a `versionCode` ${{ needs.versao.outputs.code }}.

            O deploy do backend e do front acontece separado — veja
            `docs/PUBLISH.md` e `deploy/vps/README.md`.

            ### Reverter

            Play Store: interrompa o lançamento e promova a versão anterior.
            Backend: `git checkout <tag-anterior> && docker compose up -d --build`
            na VPS. O Postgres não é tocado pelo deploy, então os dados ficam.
